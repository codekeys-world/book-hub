<div class="p-2">
  <h2>Manage my book</h2>
  <hr>
  @if (errorMsg().length) {
    <div class="alert alert-danger mt-2" role="alert">
      @for (msg of errorMsg(); track msg) {
        <p class="p-0 m-0">{{msg}}</p>
      }
    </div>
  }
  <div class="d-flex gap-2">
    <div class="col-3">
      <img class="rounded-1" width="100%" height="100%" [src]="selectedPicture() || 'https://picsum.photos/1900/800'" alt="...">
      <div class="mt-2">
        <input
          (change)="onFileSelected($event)"
          type="file"
          class="form-control"
          id="formFile"
          accept="image/*">
      </div>
    </div>
    <div class="col-9">
      <form class="row">
        <div class="col-12">
          <label for="title" class="form-label">Title</label>
          <input [(ngModel)]="bookRequest().title" type="text" name="title" id="title" class="form-control" placeholder="Title of the book">
        </div>

        <div class="col-6">
          <label for="author" class="form-label">Author</label>
          <input [(ngModel)]="bookRequest().authorName" type="text" name="author" id="author" class="form-control" placeholder="Author name">
        </div>

        <div class="col-6">
          <label for="isbn" class="form-label">isbn</label>
          <input [(ngModel)]="bookRequest().isbn" type="text" name="isbn" id="isbn" class="form-control" placeholder="isbn of the book">
        </div>

        <div class="col-12">
          <label for="synopsis" class="form-label">Synopsis</label>
          <textarea [(ngModel)]="bookRequest().synopsis" rows="4" name="synopsis" id="synopsis" class="form-control" placeholder="Synopsis of the book"></textarea>
        </div>

        <div class="col-12 mt-2">
          <input [(ngModel)]="bookRequest().shareable" type="checkbox" name="shareable" id="shareable" class="form-check-input">&nbsp;
          <label for="shareable" class="form-check-label">Share me</label>
        </div>

        <div class="d-flex justify-content-end gap-2 col-12">
          <button (click)="saveBook()" type="submit" class="btn btn-outline-primary">
            <i class="fas fa-save"></i>&nbsp;Save
          </button>
          <a routerLink="/books/my-books" class="btn btn-outline-danger">
            <i class="fas fa-times"></i>&nbsp;Cancel
          </a>
        </div>

      </form>
    </div>
  </div>
</div>
