<div class="container-fluid card login-container">
  <h3 class="text-center">Login</h3>
  <hr>
  @if (errorMsg().length) {
    <div class="alert alert-danger" role="alert" >
      @for (msg of errorMsg(); track msg) {
        <p>{{msg}}</p>
      }
    </div>
  }
  <div class="mb-3">
    <label for="login" class="form-label">Email address</label>
    <input [(ngModel)]="authRequest.email" type="email" name="email" id="login" class="form-control" placeholder="name@example.com">
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input [(ngModel)]="authRequest.password" type="password" name="password" id="password" class="form-control" placeholder="name@example.com">
  </div>
  <div class="d-flex justify-content-between mb-3">
    <div>
      <button (click)="login()" type="button" class="btn btn-primary">
        <i class="fas fa-sign-in-alt"></i>&nbsp;
        <em >Sign in</em>
      </button>
    </div>
    <div>
      Don't have an account ? &nbsp;
      <button (click)="register()" type="button" class="btn btn-link">
        <em>Register</em>
      </button>
    </div>
  </div>

</div>
