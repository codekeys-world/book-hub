<div class="container-fluid card login-container">
  <h3 class="text-center">Create an account</h3>
  <hr>
  @if (errorMsg().length) {
    <div class="alert alert-danger" role="alert" >
      @for (msg of errorMsg(); track msg) {
        <p>{{msg}}</p>
      }
    </div>
  }
  <div class="mb-3">
    <label for="firstname" class="form-label">Firstname</label>
    <input [(ngModel)]="registerRequest.firstname" type="text" name="email" id="firstname" class="form-control" placeholder="Mama Bino">
  </div>

  <div class="mb-3">
    <label for="lastname" class="form-label">Lastname</label>
    <input [(ngModel)]="registerRequest.lastname" type="text" name="lastname" id="lastname" class="form-control" placeholder="DAOU">
  </div>

  <div class="mb-3">
      <label for="login" class="form-label">Email address</label>
      <input [(ngModel)]="registerRequest.email" type="email" name="email" id="login" class="form-control" placeholder="name@example.com">
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input [(ngModel)]="registerRequest.password" type="password" name="password" id="password" class="form-control" placeholder="name@example.com">
  </div>
  <div class="d-flex justify-content-between mb-3">
    <div>
      <button (click)="register()" type="button" class="btn btn-primary">
        <i class="fas fa-sign-in-alt"></i>&nbsp;
        <em>Register</em>
      </button>
    </div>
    <div>
      Already have an account ? &nbsp;
      <button (click)="login()" type="button" class="btn btn-link">
        <em>Login</em>
      </button>
    </div>
  </div>

</div>
