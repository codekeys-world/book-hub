services:
  postgres:
    container_name: postgres-sql-bsn
    image: postgres
    environment:
      POSTGRES_USER: codekeys
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: book_social_network
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - book_social_network
    restart: unless-stopped

  mail-dev:
    container_name: mail-dev-bsn
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
  bsn-api:
    container_name: bsn-api
    image: bsn/bsn:1.0.0
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres-sql-bsn:5432/book_social_network
      DB_USERNAME: codekeys
      DB_PASSWORD: password
    networks:
      - book_social_network
    depends_on:
      - postgres
  bsn-ui:
    container_name: bsn-ui
    image: bsn/bsn-ui:1.0.0
    ports:
      - "4200:80"
    networks:
      - book_social_network
    depends_on:
      - bsn-api
networks:
  book_social_network:
    driver: bridge
volumes:
  postgres:
    driver: local